server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    location ~ /\. { deny all; }
    location ~ ^/(vendor|storage|config)/ { deny all; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass app:9000; }
}

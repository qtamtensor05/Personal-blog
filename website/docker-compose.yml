services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
        - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
        - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  phpmyadmin:
    image: phpmyadmin:5.2
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:8080:80"

volumes:
  mysql-data:
  redis-data:

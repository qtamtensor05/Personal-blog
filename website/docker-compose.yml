x-app: &app
  image: personal-blog-app:latest
  build:
    context: .
    target: application
  env_file:
    - .env
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  volumes:
    - blog_storage:/var/www/html/storage
    - blog_cache:/var/www/html/bootstrap/cache
  networks:
    - blog-network

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD", "php", "artisan", "about", "--only=environment"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: personal-blog-web:latest
    build:
      context: .
      target: web
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    networks:
      - blog-network

  worker:
    <<: *app
    command: php artisan queue:work redis --sleep=2 --tries=3 --backoff=10 --timeout=90
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[q]ueue:work'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *app
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"

  mysql:
    container_name: blog-mysql
    image: mysql:8.4
    ports:
      - "${DB_PORT}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    command:
      - --log-bin-trust-function-creators=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - blog_mysql_data:/var/lib/mysql
    networks:
      - blog-network

  phpmyadmin:
    profiles:
      - dev

    container_name: blog-phpmyadmin
    image: phpmyadmin:5.2
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - blog-network

  redis:
    container_name: blog-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - blog_redis_data:/data
    networks:
      - blog-network

volumes:
  blog_mysql_data:
  blog_redis_data:
  blog_storage:
  blog_cache:

networks:
  blog-network:
    driver: bridge

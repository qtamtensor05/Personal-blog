services:
  nginx:
    restart: unless-stopped
    ports: !override ["127.0.0.1:${APP_PORT:-8000}:80"]
  app:
    restart: unless-stopped
    environment: &production-environment
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: warning
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "true"
  worker:
    restart: unless-stopped
    environment: *production-environment
  scheduler:
    restart: unless-stopped
    environment: *production-environment
  mysql:
    restart: unless-stopped
    ports: !reset []
  redis:
    restart: unless-stopped
    ports: !reset []

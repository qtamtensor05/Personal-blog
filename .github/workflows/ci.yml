name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:2lyQbJz0iOVlST7mkVGUo4w8E6qX1giNtFMmvuEk2v0=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: blog_test
      DB_USERNAME: root
      DB_PASSWORD: local-secret
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-secret
          MYSQL_DATABASE: blog_test
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -plocal-secret"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Verify tracked runtime SQL inputs
        run: |
          git ls-files --error-unmatch website/database/sql/blog_platform_mysql.sql website/database/sql/seed_roles_permissions.sql
          test -s website/database/sql/blog_platform_mysql.sql
          test -s website/database/sql/seed_roles_permissions.sql
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_mysql, redis, zip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - working-directory: website
        run: composer install --no-interaction --prefer-dist
      - working-directory: website
        run: npm ci --ignore-scripts
      - working-directory: website
        run: npm run build
      - working-directory: website
        run: php artisan test
      - working-directory: website
        run: php vendor/bin/pint --test
      - working-directory: website
        run: npm run lint && npm run format:check && npm audit
